name: checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release PR source
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          case "${{ github.head_ref }}" in
            develop|hotfix/*) echo "release source ok: ${{ github.head_ref }}" ;;
            *) echo "PRs into main must come from develop or hotfix/*, got ${{ github.head_ref }}"; exit 1 ;;
          esac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Module unit tests
        run: |
          for m in yht lq zc zqo lj; do
            echo "::group::$m"
            python -B -m unittest discover -s "docs/modules/$m/prototype" -v
            echo "::endgroup::"
          done
      - name: v2 unified schema tests
        if: hashFiles('docs/v2/schema/test_*.py') != ''
        run: python -B -m unittest discover -s docs/v2/schema -v
      - name: Integration checks
        run: |
          python -B docs/integration/audit.py --output "$RUNNER_TEMP/audit.json"
          python -B docs/integration/five_module.py --output "$RUNNER_TEMP/five-module.json"
          python -B docs/modules/lq/prototype/review_integration.py --output "$RUNNER_TEMP/risk-review.json"
      - name: Whitespace check
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
